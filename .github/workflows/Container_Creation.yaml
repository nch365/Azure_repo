name: Create Storage Containers (JSON Input)

on:
  workflow_dispatch:
    inputs:
      storage_account:
        description: "Storage Account Name"
        required: true
      json_path:
        description: "Path to JSON file (e.g., ./config/containers.json)"
        required: true
        default: "./containers.json"

jobs:
  create-containers:
    runs-on: ubuntu-latest

    env:
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Azure CLI + jq
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          sudo apt-get install -y jq

      - name: Create containers from JSON
        run: |
          echo "Storage Account (input): ${{ github.event.inputs.storage_account }}"
          echo "Reading JSON from: ${{ github.event.inputs.json_path }}"

          containers=$(jq -r '.containers[]' "${{ github.event.inputs.json_path }}")

          for container in $containers; do

            # Convert to lowercase
            container=$(echo "$container" | tr '[:upper:]' '[:lower:]')

            # Validate name
            if [[ ! "$container" =~ ^[a-z0-9-]+$ ]]; then
              echo "Invalid container name: $container"
              exit 1
            fi

            echo "Creating container: $container"

            az storage container create \
              --name "$container" \
              --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
              --fail-on-exist false

          done
