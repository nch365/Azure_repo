name: Manual Deploy to Azure Function

on:
  workflow_dispatch:
    inputs:
      function_app:
        description: "Select Azure Function App"
        required: true
        type: choice
        options:
          - httptriggernch
          - XYZ_App   

      package_path:
        description: "Enter folder path (e.g., ./AZ_app)"
        required: true
        default: "./AZ_app"

env:
  NODE_VERSION: '18.x'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: |
          cd ${{ github.event.inputs.package_path }}
          rm -rf node_modules
          npm install --production

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ${{ github.event.inputs.package_path }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ github.event.inputs.function_app }}   
          package: '.'                                        
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}