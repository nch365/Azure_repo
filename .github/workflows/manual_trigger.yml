name: Build and deploy Node.js project to Azure Function App - httptriggernch

on:
  workflow_dispatch:   # ✅ removed auto deploy on push

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './AZ_app'   # ✅ FIXED (your app folder)
  NODE_VERSION: '18.x'                         # ✅ FIXED (Azure-supported)

jobs:
  build:
    runs-on: ubuntu-latest   # ✅ changed from windows (faster & standard)
    permissions:
      contents: read
      
    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }} Environment
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          rm -rf node_modules
          npm install --production

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}   # ✅ only upload AZ_app

  deploy:
    runs-on: ubuntu-latest   # ✅ changed
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      # ❌ Removed Azure login (not needed for publish profile)

      - name: Deploy to Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: httptriggernch
          package: '.'   # ✅ artifact root is already AZ_app
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}