name: PR Validation Check

on:
  pull_request:
    branches: [main]

permissions:
  issues: write
  pull-requests: write

jobs:
  validation:
    name: Manual Validation Check
    runs-on: ubuntu-latest

    steps:
      - name: Dummy validation
        id: validate
        run: |
          echo "Running validation..."

          # ✅ CHANGE THIS CONDITION
          if [ 1 -eq 1 ]; then
            echo "PASSED"
            exit 0
          else
            echo "FAILED"
            exit 1
          fi

      - name: Add comment to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ job.status }}';
            const icon = outcome === 'success' ? '✅' : '❌';

            const msg = outcome === 'success'
              ? `${icon} Validation Passed`
              : `${icon} Validation Failed. Do not merge`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: msg
            });
