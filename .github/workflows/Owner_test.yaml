name: Manual PR Check

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number'
        required: true
        type: number

# ✅ ADD THIS BLOCK (this is the fix)
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  manual-check:
    name: Manual Validation Check
    runs-on: ubuntu-latest

    steps:
      - name: Dummy validation
        id: validate
        run: |
          echo "Running manual validation..."

          if [ 1 -eq 1 ]; then
            exit 0
          else
            exit 1
          fi

      - name: Add comment to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ job.status }}';
            const prNumber = ${{ github.event.inputs.pr_number }};
            const icon = outcome === 'success' ? '✅' : '❌';

            const msg = outcome === 'success'
              ? `${icon} Manual check passed`
              : `${icon} Manual check failed. Do not merge`;

            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: msg
            });
