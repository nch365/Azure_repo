name: Build and deploy Node.js project to Azure Function App - httptriggernch

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './myFunctionApp'
  NODE_VERSION: '24.x'
  RESOURCE_GROUP: 'Azure_apps'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }} Environment
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 'Resolve Project Dependencies Using Npm'
        shell: pwsh
        run: |
          pushd './myFunctionApp'
          npm install
          popd

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            myFunctionApp/*
            !myFunctionApp/node_modules/** 

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: myFunctionApp
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_035E102F54624CBA9218E454B8271C17 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B12579310C5A40089B0C640169DAFADE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_587549F8BE9E4903A08BD13D8E7608D4 }}

      - name: Ensure WEBSITE_RUN_FROM_PACKAGE=1
        shell: pwsh
        run: |
          # Get existing app settings
          $appSettings = az functionapp config appsettings list `
            --name httptriggernch `
            --resource-group ${{ env.RESOURCE_GROUP }} | ConvertFrom-Json

          # Check if already set
          $setting = $appSettings | Where-Object {$_.name -eq "WEBSITE_RUN_FROM_PACKAGE"}
          if (-not $setting) {
            Write-Host "Adding WEBSITE_RUN_FROM_PACKAGE=1"
            az functionapp config appsettings set `
              --name httptriggernch `
              --resource-group ${{ env.RESOURCE_GROUP }} `
              --settings WEBSITE_RUN_FROM_PACKAGE=1
          } else {
            Write-Host "WEBSITE_RUN_FROM_PACKAGE already set!"
          }

      - name: Move functions to root
        shell: pwsh
        run : |
          Copy-Item -Path myFunctionApp/src/functions/* -Destination myFunctionApp/ -Recurse -Force

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'httptriggernch'
          slot-name: 'Production'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}